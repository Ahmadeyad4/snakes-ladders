<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حية ودرج</title>
<style>
:root{
  --ink:#141838; --panel:#222858; --panel2:#2d3470; --mint:#cdeee0; --sky:#bfe0f3;
  --gold:#ffcf4a; --text:#f4f6ff;
  --ca:#cdeee0; --cb:#bfe0f3; --cend:#ffcf4a; --frame:#ffcf4a; --num:#1b2a3acc; --grid:rgba(30,60,90,.5); --muted:#9aa3d6; --bad:#ff6b81;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 4px env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--panel2);
  border-radius:12px;padding:12px 14px;outline:none;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--gold);color:#2a2100;font-weight:700;border-radius:14px;padding:13px 16px}
.btn.alt{background:var(--panel2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}
#screens{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

/* الرئيسية */
#home{justify-content:center;gap:14px;max-width:420px;width:100%;margin:0 auto}
#home h1{font-size:54px;margin:0;text-align:center;line-height:1;letter-spacing:-1px}
#home h1 small{display:block;font-size:16px;font-weight:400;color:var(--muted);margin-top:8px;letter-spacing:0}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sep{color:var(--muted);text-align:center;font-size:14px}
#codeIn{text-align:center;letter-spacing:6px;text-transform:uppercase;font-weight:700}

/* الغرفة */
#lobby{align-items:center;justify-content:center;gap:14px;max-width:420px;width:100%;margin:0 auto}
.code{font-size:48px;font-weight:800;letter-spacing:10px;color:var(--gold);direction:ltr}
.slots{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{background:var(--panel);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;min-height:48px}
.slot.empty{color:var(--muted);border:2px dashed var(--panel2);background:none}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #fff8}

/* اللعب */
#game{align-items:center;gap:6px;padding-top:6px}
#top{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
#top button{background:none;color:var(--muted);padding:4px 8px}
#chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
.chip{position:relative;background:var(--panel);border-radius:999px;padding:5px 12px 5px 10px;display:flex;align-items:center;gap:6px;
  font-size:13px;border:2px solid transparent}
.chip.turn{border-color:var(--gold);background:var(--panel2)}
.chip.off{opacity:.45}
.bubble{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:26px;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.2)}to{transform:translateX(-50%) scale(1)}}
#boardWrap{direction:ltr;width:min(calc(100vw - 8px),55dvh);aspect-ratio:1;position:relative;
  border:5px solid var(--frame);border-radius:10px;background:var(--frame);flex:none}
#board{font-size:12px;direction:ltr;position:absolute;inset:0}
.cell{position:absolute;width:10%;height:10%;color:var(--num);font-size:1em;font-weight:700;padding:1px 3px;box-shadow:inset 0 0 0 .6px var(--grid)}
.cell.a{background:var(--ca)} .cell.b{background:var(--cb)}
.cell.end{background:var(--cend);color:#2a2100}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{will-change:left,top;position:absolute;width:4.6%;height:4.6%;border-radius:50%;border:2px solid #fff;
  transform:translate(-50%,-50%);transition:left .17s linear,top .17s linear;box-shadow:0 2px 4px #0006;z-index:3}
.tok.me{box-shadow:0 0 0 2px var(--ink),0 0 0 4px #fff}
#ctrl{display:flex;align-items:center;gap:12px;width:100%;justify-content:center}
#dice{font-size:54px;line-height:1;width:76px;height:76px;border-radius:18px;background:#fff;color:#1b2a3a;
  display:flex;align-items:center;justify-content:center;flex:none}
#rollBtn{flex:1;max-width:240px;font-size:18px;padding:16px}
#rollBtn.wait{background:var(--panel2);color:var(--muted)}
#toast{position:fixed;top:12%;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:12px;
  font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
#win{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:10}
#win.on{display:flex}
#win div{background:var(--panel);border-radius:20px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:14px;min-width:260px}
#win h2{margin:0;font-size:30px}

/* الدردشة */
#chat{display:none;flex-direction:column;gap:6px;height:25dvh;min-height:150px;padding:6px 0}
#chat.on{display:flex}
#log{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border-radius:12px;padding:8px 10px;font-size:14px}
#log p{margin:0 0 4px;overflow-wrap:anywhere}
#log b{margin-inline-end:6px}
#emojis{display:flex;gap:4px;justify-content:space-between}
#emojis button{background:var(--panel);border-radius:10px;font-size:22px;padding:4px 0;flex:1}
#emojis button:active{background:var(--panel2)}
#chatRow{display:flex;gap:6px}
#chatIn{padding:9px 12px}
#chatRow .btn{padding:9px 16px}
#myid{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px}
#myid b{color:var(--gold);font-size:20px;letter-spacing:2px;direction:ltr}
.mini{padding:6px 12px;font-size:14px;border-radius:10px}
#badge{background:var(--bad);color:#fff;border-radius:999px;padding:0 8px;font-size:13px;margin-inline-start:6px}
#badge:empty{display:none}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:15;padding:12px}
.modal.on{display:flex}
.card{background:var(--panel);border-radius:20px;padding:18px;width:min(100%,380px);max-height:85dvh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.frow{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:12px;padding:8px 10px}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow small{color:var(--muted);direction:ltr;display:inline-block;margin-inline-start:6px}
.empty-note{color:var(--muted);font-size:14px;text-align:center;padding:8px}
@keyframes hop{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-80%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
.tok.hop{animation:hop .19s ease-out}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(-3px)}50%{transform:rotate(12deg)}75%{transform:rotate(-10deg) translateY(-2px)}100%{transform:rotate(0)}}
#dice.rolling{animation:shake .22s linear infinite}
#mute{font-size:18px}
body{background:radial-gradient(900px 520px at 50% -5%,#323b9a 0%,transparent 70%),var(--ink)}
.logo{text-align:center}
.logo .em{font-size:44px;letter-spacing:6px}
.logo h1{margin:2px 0 0;font-size:46px;text-shadow:0 4px 0 #0006}
.me{display:flex;gap:8px;align-items:center}
.me input{flex:1;text-align:center;font-weight:700}
.idpill{background:var(--panel);border-radius:12px;padding:12px;white-space:nowrap;font-size:14px;color:var(--muted)}
.idpill b{color:var(--gold);letter-spacing:1px;direction:ltr;display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;border-radius:24px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;font-size:19px;font-weight:800;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.tile .ic{font-size:46px;line-height:1}
.tile.t1{background:linear-gradient(145deg,#ff8a5c,#ff4d6d)}
.tile.t2{background:linear-gradient(145deg,#3fe0b0,#14a085)}
.tile.t3{background:linear-gradient(145deg,#ffd75e,#ff9f1c);color:#3a2600}
.tile.t4{background:linear-gradient(145deg,#80a8ff,#5a5cff)}
.tile i{position:absolute;top:10px;inset-inline-start:10px;background:#fff;color:#c02040;border-radius:999px;min-width:26px;height:26px;
  padding:0 7px;margin:0;font-style:normal;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tile i:empty{display:none}
.lobtitle{font-size:28px;font-weight:800}
.lobsub{color:var(--muted);min-height:1.4em;text-align:center}
.btn.big{font-size:18px;padding:16px}
#lobby .btn,.card>.btn{width:100%}
.idbox{display:flex;align-items:center;gap:10px;color:var(--muted)}
.idbox b{color:var(--gold);font-size:28px;letter-spacing:3px;direction:ltr;flex:1;text-align:center}
  .ver{color:var(--muted);text-align:center;font-size:12px;opacity:.7}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#screens,#chat{position:relative;z-index:1}
#fx span{position:absolute;top:-8vh;animation:fall linear infinite;opacity:.85}
@keyframes fall{0%{transform:translate(0,-10vh) rotate(0)}50%{transform:translate(30px,55vh) rotate(180deg)}100%{transform:translate(-10px,115vh) rotate(360deg)}}
#fx.twinkle span{animation-name:twinkle;animation-timing-function:ease-in-out}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:var(--panel2);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;border:3px solid transparent;font-weight:700}
.tcard.on{border-color:var(--gold)}
.tcard .sw{display:grid;grid-template-columns:repeat(4,1fr);width:100%;height:34px;border-radius:8px;overflow:hidden;border:2px solid var(--frm,#fff4)}
.tcard .ic{font-size:30px;line-height:1}
#themeBtn2{font-size:18px}
@media (min-aspect-ratio:5/4){
  body{flex-direction:row;gap:8px}
  #chat{height:auto;width:min(340px,30vw);align-self:stretch}
}
#net{position:fixed;top:0;left:0;right:0;background:#d62e4a;color:#fff;text-align:center;padding:6px;font-size:14px;z-index:30;display:none}
#net.on{display:block}
#log p.sys{color:var(--muted);font-style:italic}
#winSub{color:var(--muted)}
@media (prefers-reduced-motion:reduce){#fx{display:none}}
@media (prefers-reduced-motion:reduce){.tok{transition:none}.bubble{animation:none}}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div id="screens">

  <section id="home" class="screen on">
    <div class="logo"><div class="em">🐍🪜</div><h1>حية ودرج</h1></div>
    <div class="me">
      <input id="nameIn" maxlength="14" placeholder="اكتب اسمك" autocomplete="off">
      <button class="idpill" id="copyId" aria-label="نسخ رقمك">رقمك <b id="myIdVal">------</b> 📋</button>
      <button class="idpill" data-themes aria-label="المظهر">🎨</button>
    </div>
    <div class="tiles">
      <button class="tile t1" id="tInvite"><span class="ic">📨</span>دعوة صديق<i id="onlineN"></i></button>
      <button class="tile t2" id="tAdd"><span class="ic">➕</span>إضافة صديق<i id="badge"></i></button>
      <button class="tile t3" id="tRandom"><span class="ic">🎲</span>لعب عشوائي</button>
      <button class="tile t4" id="tBot"><span class="ic">🤖</span>ضد الجهاز</button>
    </div>
    <div class="ver">الإصدار 6</div>
  </section>

  <section id="lobby" class="screen">
    <div class="lobtitle" id="lobTitle">الغرفة</div>
    <div class="lobsub" id="lobSub"></div>
    <div class="slots" id="slots"></div>
    <button class="btn alt" id="inviteBtn">📨 دعوة صديق</button>
    <button class="btn big" id="startBtn">ابدأ اللعب</button>
    <button class="btn alt" data-leave>خروج</button>
  </section>

  <section id="game" class="screen">
    <div id="top"><span id="gcode"></span><button id="themeBtn2" data-themes aria-label="المظهر">🎨</button><button id="mute" aria-label="الصوت">🔊</button><button data-leave>خروج</button></div>
    <div id="chips"></div>
    <div id="boardWrap">
      <div id="board"></div>
      <svg id="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div id="toks"></div>
    </div>
    <div id="ctrl">
      <div id="dice">⚀</div>
      <button class="btn" id="rollBtn">ارمِ النرد</button>
    </div>
  </section>
</div>

<div id="chat">
  <div id="log"></div>
  <div id="emojis"></div>
  <div id="chatRow">
    <input id="chatIn" maxlength="200" placeholder="اكتب رسالة" autocomplete="off">
    <button class="btn" id="chatSend">إرسال</button>
  </div>
</div>
<div class="modal" id="addp"><div class="card">
  <h3>➕ إضافة صديق</h3>
  <div class="idbox">رقمك<b id="myIdBig">------</b><button class="btn alt mini" id="copyId2">نسخ</button></div>
  <div class="sub">اكتب رقم صديقك لإرسال طلب صداقة</div>
  <div class="row"><input id="fid" inputmode="numeric" maxlength="6" placeholder="رقم صديقك" autocomplete="off"><button class="btn" id="fadd">إضافة</button></div>
  <div id="freqs"></div><div id="flist"></div>
  <button class="btn alt" data-close>إغلاق</button>
</div></div>
<div class="modal" id="pick"><div class="card">
  <h3>📨 اختر صديقاً للدعوة</h3>
  <div id="plist"></div>
  <button class="btn alt" id="pickAdd">➕ إضافة صديق</button>
  <button class="btn alt" data-close>إغلاق</button>
</div></div>
<div class="modal" id="themep"><div class="card">
  <h3>🎨 اختر المظهر</h3>
  <div class="themes" id="themeList"></div>
  <button class="btn alt" data-close>إغلاق</button>
</div></div>
<div class="modal" id="botp"><div class="card">
  <h3>🤖 العب ضد الجهاز</h3>
  <button class="btn" data-bots="1">ضد جهاز واحد</button>
  <button class="btn" data-bots="3">ضد 3 أجهزة</button>
  <button class="btn" data-bots="5">ضد 5 أجهزة</button>
  <button class="btn alt" data-close>إغلاق</button>
</div></div>
<div class="modal" id="inv"><div class="card"><h3 id="invText"></h3><div class="row"><button class="btn" id="invYes">قبول</button><button class="btn alt" id="invNo">رفض</button></div></div></div>
<div id="net">⚠️ انقطع الاتصال، جاري إعادة المحاولة...</div>
<div id="toast"></div>
<div id="win"><div><h2 id="winText"></h2><div id="winSub"></div><button class="btn" id="againBtn">لعبة جديدة</button><button class="btn alt" data-leave>خروج</button></div></div>

<script>
const SNAKES={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const LADDERS={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const EMOJIS=['😂','😡','👏','😭','🔥','👍','😎','🙈'];
const FACES=['⚀','⚁','⚂','⚃','⚄','⚅'];
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ---------- الصوت (مولَّد بالكود، بدون ملفات) ----------
let actx=null,muted=localStorage.getItem('sl_mute')==='1';
function audio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
  return actx;
}
function tone(freq,dur,type,vol,when,slideTo){
  if(muted)return;const c=audio();if(!c)return;const t=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol,when,freq){
  if(muted)return;const c=audio();if(!c)return;const t=c.currentTime+(when||0);
  const len=Math.max(1,Math.floor(c.sampleRate*dur)),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource();s.buffer=buf;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1800;
  const g=c.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
}
const sfx={
  rattle(){noise(.05,.5,0,1200+Math.random()*1800);tone(160+Math.random()*140,.05,'square',.04)},
  land(){tone(150,.14,'triangle',.3,0,70);noise(.08,.4,0,600)},
  step(n){tone(420+n*45,.09,'triangle',.18)},
  snake(){tone(620,.9,'sawtooth',.1,0,70);tone(480,.9,'square',.05,.05,60);if(navigator.vibrate)navigator.vibrate([60,40,60])},
  ladder(){[392,494,587,784].forEach((f,i)=>tone(f,.16,'sine',.18,i*.1))},
  bad(){tone(200,.2,'square',.08,0,150)},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.2,i*.14))},
  turn(){tone(660,.1,'sine',.15);tone(880,.14,'sine',.15,.11)},
  chat(){tone(1000,.07,'sine',.1)},
  ding(){tone(1175,.12,'sine',.15);tone(1568,.2,'sine',.12,.1)}
};
document.addEventListener('pointerdown',()=>audio());

let token=localStorage.getItem('sl_token');
if(!token){token=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/-/g,'');localStorage.setItem('sl_token',token)}
$('nameIn').value=localStorage.getItem('sl_name')||'';

// ---------- اللوحة ----------
function xy(n){const r=Math.floor((n-1)/10);let c=(n-1)%10;if(r%2)c=9-c;return{x:c*10+5,y:(9-r)*10+5}}
(function buildBoard(){
  const b=$('board');
  for(let n=1;n<=100;n++){
    const p=xy(n),vc=(p.x-5)/10,vr=(p.y-5)/10,d=document.createElement('div');
    d.className='cell '+((vr+vc)%2?'a':'b')+(n===100?' end':'');
    d.style.left=(p.x-5)+'%';d.style.top=(p.y-5)+'%';d.textContent=n;b.appendChild(d);
  }
})();
function drawArt(){
  const T=THEMES[themeKey],NS='http://www.w3.org/2000/svg',svg=$('lines');svg.innerHTML='';
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
  const pts=a=>a.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');

  // ---- السلالم: خشب بقوائم وعوارض وظل ----
  for(const s in LADDERS){
    const a=xy(+s),z=xy(LADDERS[s]),dx=z.x-a.x,dy=z.y-a.y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,px=-uy*1.6,py=ux*1.6;
    const x1=a.x+ux*2,y1=a.y+uy*2,x2=z.x-ux*2,y2=z.y-uy*2,L=len-4;
    for(const sg of [1,-1])
      el('line',{x1:x1+px*sg+.5,y1:y1+py*sg+.7,x2:x2+px*sg+.5,y2:y2+py*sg+.7,stroke:'#000','stroke-opacity':.22,'stroke-width':1.5,'stroke-linecap':'round'});
    for(let t=1.5;t<L;t+=3.3){
      const cx=x1+ux*t,cy=y1+uy*t;
      el('line',{x1:cx+px+.3,y1:cy+py+.4,x2:cx-px+.3,y2:cy-py+.4,stroke:'#000','stroke-opacity':.2,'stroke-width':1,'stroke-linecap':'round'});
      el('line',{x1:cx+px,y1:cy+py,x2:cx-px,y2:cy-py,stroke:T.lad.rung,'stroke-width':1,'stroke-linecap':'round'});
      el('line',{x1:cx+px*.9,y1:cy+py*.9-.2,x2:cx-px*.9,y2:cy-py*.9-.2,stroke:T.lad.rungHi,'stroke-width':.35,'stroke-linecap':'round'});
    }
    for(const sg of [1,-1]){
      el('line',{x1:x1+px*sg,y1:y1+py*sg,x2:x2+px*sg,y2:y2+py*sg,stroke:T.lad.rail,'stroke-width':1.3,'stroke-linecap':'round'});
      el('line',{x1:x1+px*sg-.25,y1:y1+py*sg-.25,x2:x2+px*sg-.25,y2:y2+py*sg-.25,stroke:T.lad.hi,'stroke-width':.4,'stroke-linecap':'round'});
    }
  }

  // ---- الأفاعي: جسم متموج رفيع نحو الذيل، بقع وحزوز، رأس بعيون ولسان ----
  const PAL=T.snakes;
  let k=0;
  for(const s in SNAKES){
    const a=xy(+s),z=xy(SNAKES[s]),dx=z.x-a.x,dy=z.y-a.y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    const pal=PAL[k++%PAL.length],N=52,waves=Math.max(1.5,len/15),amp=Math.min(3.4,len*.17);
    const P=[];
    for(let i=0;i<=N;i++){const t=i/N,off=Math.sin(t*waves*2*Math.PI)*amp*Math.min(1,t*6);
      P.push([a.x+ux*len*t+nx*off,a.y+uy*len*t+ny*off]);}
    const W=t=>.5+1.9*Math.pow(1-t,.8);
    const Lf=[],Rt=[],Tg=[];
    for(let i=0;i<=N;i++){
      const p0=P[Math.max(0,i-1)],p1=P[Math.min(N,i+1)];let tx=p1[0]-p0[0],ty=p1[1]-p0[1];
      const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;Tg.push([tx,ty]);
      const w=W(i/N)/2,sx=-ty,sy=tx;
      Lf.push([P[i][0]+sx*w,P[i][1]+sy*w]);Rt.push([P[i][0]-sx*w,P[i][1]-sy*w]);
    }
    const poly=Lf.concat(Rt.slice().reverse());
    el('polygon',{points:pts(poly),fill:'#000',opacity:.22,transform:'translate(.5 .7)'});
    const fx=-Tg[0][0],fy=-Tg[0][1],sx=-fy,sy=fx,H=[P[0][0]+fx*.9,P[0][1]+fy*.9];
    const t1=[H[0]+fx*2,H[1]+fy*2],t2=[H[0]+fx*3.5,H[1]+fy*3.5];
    el('line',{x1:t1[0],y1:t1[1],x2:t2[0],y2:t2[1],stroke:'#e11d48','stroke-width':.35,'stroke-linecap':'round'});
    for(const sg of [1,-1])
      el('line',{x1:t2[0],y1:t2[1],x2:t2[0]+fx*.9+sx*.6*sg,y2:t2[1]+fy*.9+sy*.6*sg,stroke:'#e11d48','stroke-width':.3,'stroke-linecap':'round'});
    el('polygon',{points:pts(poly),fill:pal[0],stroke:pal[1],'stroke-width':.25,'stroke-linejoin':'round'});
    for(let i=3;i<N-1;i++){
      if(i%4===2){
        const m=.85,A=[P[i][0]+(Lf[i][0]-P[i][0])*m,P[i][1]+(Lf[i][1]-P[i][1])*m],B=[P[i][0]+(Rt[i][0]-P[i][0])*m,P[i][1]+(Rt[i][1]-P[i][1])*m];
        el('line',{x1:A[0],y1:A[1],x2:B[0],y2:B[1],stroke:pal[1],'stroke-width':.6,'stroke-opacity':.55,'stroke-linecap':'round'});
      }else if(i%4===0){
        el('circle',{cx:P[i][0],cy:P[i][1],r:Math.max(.12,W(i/N)*.14),fill:pal[2],'fill-opacity':.85});
      }
    }
    const ang=Math.atan2(fy,fx)*180/Math.PI;
    el('ellipse',{cx:H[0],cy:H[1],rx:2.3,ry:1.75,fill:pal[0],stroke:pal[1],'stroke-width':.3,transform:`rotate(${ang.toFixed(1)} ${H[0].toFixed(2)} ${H[1].toFixed(2)})`});
    for(const sg of [1,-1]){
      const ex=H[0]+fx*.8+sx*.95*sg,ey=H[1]+fy*.8+sy*.95*sg;
      el('circle',{cx:ex,cy:ey,r:.55,fill:'#fff'});
      el('circle',{cx:ex+fx*.15,cy:ey+fy*.15,r:.28,fill:'#111'});
    }
  }
}

let social=null,pendingInvite=null,winShown=false,inviteQueue=[];
let ws,room=null,disp=[],animating=false,queue=Promise.resolve(),wantRoom=null,retry=null;

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host);
  ws.onopen=()=>{ $('net').classList.remove('on'); tx({t:'hello',name:$('nameIn').value.trim()}); if(wantRoom) tx({t:'join',code:wantRoom,name:myName()}); };
  ws.onmessage=e=>{const m=JSON.parse(e.data);queue=queue.then(()=>handle(m)).catch(console.error)};
  ws.onclose=()=>{$('net').classList.add('on');clearTimeout(retry);retry=setTimeout(connect,1500)};
}
function tx(o){o.token=token;if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else toast('لا يوجد اتصال، انتظر...')}
function myName(){const n=$('nameIn').value.trim();localStorage.setItem('sl_name',n);return n||'لاعب'}
connect();

function fitBoard(){
  const g=$('game');if(!g||!g.classList.contains('on'))return;
  const vw=document.documentElement.clientWidth,vh=window.innerHeight,land=vw/vh>=1.25;
  const cs=getComputedStyle(document.body),pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const fixed=$('top').offsetHeight+$('chips').offsetHeight+$('ctrl').offsetHeight+24+pad;
  let size;
  if(land){size=Math.min(vw-Math.min(340,vw*.3)-24,vh-fixed)}
  else{size=Math.min(vw-8,vh-fixed-140)}
  size=Math.max(200,Math.floor(size));
  const w=$('boardWrap');w.style.width=size+'px';w.style.height=size+'px';
  $('board').style.fontSize=Math.max(8,size/10*.27)+'px';
  $('chat').style.height=land?'':Math.max(140,Math.floor(vh-fixed-size))+'px';
}
window.addEventListener('resize',fitBoard);
window.addEventListener('orientationchange',()=>setTimeout(fitBoard,200));
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id!=='game')$('chat').style.height='';else fitBoard();
  $('chat').classList.toggle('on',id!=='home')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}

// ---------- معالجة الرسائل ----------
async function handle(m){
  if(m.t==='room'){
    const wasMine=!!room&&room.state==='play'&&room.turn===room.you;
    room=m;wantRoom=m.code;
    disp=m.players.map(p=>p.pos);
    if(m.state==='play'&&m.turn===m.you&&!wasMine&&!animating)sfx.turn();
    m._dl=m.startIn!=null?Date.now()+m.startIn:null;
    if(m.state==='lobby'){
      $('win').classList.remove('on');
      if(inviteQueue.length){inviteQueue.forEach(id=>tx({t:'invite',id}));inviteQueue=[]}
    }
    render();
  }else if(m.t==='move'){
    animating=true;render();
    const dice=$('dice');dice.classList.add('rolling');
    for(let k=0;k<9;k++){dice.textContent=FACES[Math.floor(Math.random()*6)];sfx.rattle();await sleep(75)}
    dice.classList.remove('rolling');dice.textContent=FACES[m.dice-1];sfx.land();
    await sleep(250);
    const i=m.i;
    if(m.land===m.from){toast('تحتاج الرقم المضبوط للوصول إلى 100');sfx.bad();await sleep(500)}
    else{for(let s=m.from+1;s<=m.land;s++){disp[i]=s;placeToks();hop(i);sfx.step(s-m.from);await sleep(190)}}
    if(m.to!==m.land){
      const down=m.to<m.land;
      toast(down?'🐍 لدغتك حية!':'🪜 صعدت درج!');
      if(down)sfx.snake();else sfx.ladder();
      await sleep(350);await slide(i,m.to);
    }
    animating=false;render();
  }else if(m.t==='chat'){
    addLog(m);
    if(room&&m.i!==room.you)sfx.chat();
    if(m.emoji)bubble(m.i,m.text);
  }else if(m.t==='social'){
    const prev=social?social.requests.length:0;
    social=m;
    $('myIdVal').textContent=m.me.id;
    if(!$('nameIn').value.trim())$('nameIn').value=m.me.name;
    $('badge').textContent=m.requests.length||'';
    $('onlineN').textContent=m.friends.filter(f=>f.online).length||'';
    $('myIdBig').textContent=m.me.id;
    if(m.requests.length>prev){toast('📩 وصلك طلب صداقة جديد');sfx.ding()}
    if($('addp').classList.contains('on'))renderAdd();
    if($('pick').classList.contains('on'))renderPick();
  }else if(m.t==='invite'){
    pendingInvite=m;sfx.ding();
    $('invText').textContent=m.from.name+' يدعوك للعب (غرفة '+m.max+' لاعبين)';
    $('inv').classList.add('on');
  }else if(m.t==='sys'){
    addSys(m.text);toast(m.text);
  }else if(m.t==='ok'){
    toast(m.msg);
  }else if(m.t==='err'){
    toast(m.msg);
    if(m.fatal){wantRoom=null;room=null;show('home')}
  }
}

// ---------- الرسم ----------
function hop(i){const t=$('toks').children[i];if(!t)return;t.classList.remove('hop');void t.offsetWidth;t.classList.add('hop')}
async function slide(i,pos){
  const t=$('toks').children[i];if(t)t.style.transitionDuration='.7s';
  disp[i]=pos;placeToks();await sleep(800);
  if(t)t.style.transitionDuration='';
}
function placeToks(){
  if(!room)return;
  const box=$('toks');
  while(box.children.length>room.players.length)box.lastChild.remove();
  room.players.forEach((p,i)=>{
    let t=box.children[i];
    if(!t){t=document.createElement('div');t.className='tok';box.appendChild(t)}
    const n=disp[i]||0,pt=n?xy(n):{x:-6,y:105+i*0};
    const ox=((i%3)-1)*2.4,oy=(Math.floor(i/3)-.5)*2.6;
    t.style.background=p.color;t.classList.toggle('me',i===room.you);
    t.style.left=(n?pt.x+ox:3+i*5)+'%';t.style.top=(n?pt.y+oy:97)+'%';
  });
}
function updateSub(){
  if(!room||room.state!=='lobby')return;
  const s=$('lobSub');
  if(room.pub){
    if(room.players.length<2)s.textContent='🔍 جاري البحث عن لاعبين...';
    else if(room._dl){s.textContent='🎮 تبدأ اللعبة خلال '+Math.max(0,Math.ceil((room._dl-Date.now())/1000))+' ثانية'}
    else s.textContent='...';
  }else s.textContent='ادعُ أصدقاءك ثم ابدأ (حتى 6 لاعبين)';
}
setInterval(updateSub,500);
function render(){
  if(!room)return;
  if(room.state==='lobby'){
    show('lobby');
    $('lobTitle').textContent=room.pub?'🎲 لعب عشوائي':'🎉 غرفتك';
    const s=$('slots');s.innerHTML='';
    for(let i=0;i<room.max;i++){
      const p=room.players[i],d=document.createElement('div');d.className='slot'+(p?'':' empty');
      if(p){const c=document.createElement('span');c.className='dot';c.style.background=p.color;d.append(c,
        document.createTextNode(p.name+(i===room.host&&!room.pub?' 👑':'')+(i===room.you?' (أنت)':'')))}
      else d.textContent='بانتظار لاعب...';
      s.appendChild(d);
    }
    const host=room.host===room.you;
    $('inviteBtn').style.display=room.pub?'none':'';
    $('startBtn').style.display=(host&&!room.pub)?'':'none';
    $('startBtn').disabled=room.players.length<2;
    updateSub();
    return;
  }
  show('game');$('gcode').textContent='الغرفة '+room.code;
  const chips=$('chips');
  chips.innerHTML='';
  room.players.forEach((p,i)=>{
    const c=document.createElement('div');c.className='chip'+(i===room.turn&&room.state==='play'?' turn':'')+(p.online?'':' off');c.id='chip'+i;
    const d=document.createElement('span');d.className='dot';d.style.background=p.color;
    c.append(d,document.createTextNode(p.name+(p.online?'':' ⚠️')));chips.appendChild(c);
  });
  placeToks();fitBoard();
  const mine=room.state==='play'&&room.turn===room.you&&!animating;
  const rb=$('rollBtn');rb.disabled=!mine;rb.classList.toggle('wait',!mine);
  rb.textContent=room.state!=='play'?'انتهت اللعبة':mine?'ارمِ النرد 🎲':animating?'...':'دور '+room.players[room.turn].name;
  if(room.state==='done'&&!animating&&room.winner>=0){
    const w=room.players[room.winner];
    const mineWin=room.winner===room.you;
    $('winText').textContent=mineWin?'🏆 فزت!':'😔 خسرت، فاز '+w.name;
    $('winSub').textContent=room.reason==='left'?(mineWin?'خصمك انسحب أو انقطع اتصاله':'انتهت اللعبة'):'';
    $('againBtn').style.display='';
    if(!winShown){winShown=true;if(room.winner===room.you)sfx.win();else sfx.bad()}
    $('win').classList.add('on');
  }else{winShown=false;$('win').classList.remove('on')}
}
function addSys(text){
  const log=$('log'),row=document.createElement('p');row.className='sys';row.textContent=text;
  log.appendChild(row);while(log.children.length>80)log.firstChild.remove();log.scrollTop=log.scrollHeight;
}
function addLog(m){
  if(!room)return;
  const p=room.players[m.i],log=$('log'),row=document.createElement('p');
  const b=document.createElement('b');b.textContent=(p?p.name:'؟')+':';if(p)b.style.color=p.color;
  row.append(b,document.createTextNode(m.text));log.appendChild(row);
  while(log.children.length>80)log.firstChild.remove();
  log.scrollTop=log.scrollHeight;
}
function bubble(i,e){
  const c=$('chip'+i);if(!c)return;
  const old=c.querySelector('.bubble');if(old)old.remove();
  const b=document.createElement('span');b.className='bubble';b.textContent=e;c.appendChild(b);
  setTimeout(()=>b.remove(),2500);
}

function frow(f,acts){
  const d=document.createElement('div');d.className='frow';
  const dot=document.createElement('span');dot.className='dot';
  dot.style.background=f.online===undefined?'#7d86c9':(f.online?'#3ddc97':'#555a80');
  const nm=document.createElement('div');nm.className='nm';nm.textContent=f.name;
  const id=document.createElement('small');id.textContent=f.id;nm.appendChild(id);
  d.append(dot,nm);
  acts.forEach(a=>{const b=document.createElement('button');b.className='btn mini'+(a.primary?'':' alt');
    b.textContent=a.label;b.disabled=!!a.dis;b.onclick=a.fn;d.appendChild(b)});
  return d;
}
function heading(txt){const h=document.createElement('div');h.className='sub';h.textContent=txt;return h}

  if(!social)return;
  $('myIdBig').textContent=social.me.id;
  const fr=$('freqs'),fl=$('flist');fr.innerHTML='';fl.innerHTML='';

      {label:'قبول',primary:1,fn:()=>tx({t:'friend_accept',id:r.id})},

      {label:'حذف',fn:()=>{if(confirm('حذف '+f.name+' من الأصدقاء؟'))tx({t:'friend_remove',id:f.id})}}])));

function renderPick(){
  const pl=$('plist');pl.innerHTML='';
  if(!social||!social.friends.length){
    const e=document.createElement('div');e.className='empty-note';
    e.textContent='ما عندك أصدقاء بعد. أضف صديقك برقمه أولاً.';pl.appendChild(e);return;
  }
  const inLobby=!!room&&room.state==='lobby';
  const full=inLobby&&room.players.length>=room.max;
  social.friends.slice().sort((a,b)=>b.online-a.online).forEach(f=>{
    const sent=Date.now()-(sentAt[f.id]||0)<15000;
    pl.appendChild(frow(f,[{label:sent?'تم الإرسال ✓':(f.online?'دعوة':'غير متصل'),primary:f.online&&!sent&&!full,
      dis:!f.online||sent||full,fn:()=>inviteFriend(f)}]));
  });
}
function inviteFriend(f){
  sentAt[f.id]=Date.now();
  setTimeout(()=>{if($('pick').classList.contains('on'))renderPick()},15100);
  if(room&&room.state==='lobby'){tx({t:'invite',id:f.id});renderPick()}
  else{inviteQueue=[f.id];$('pick').classList.remove('on');tx({t:'create',max:6,name:myName()})}

    snakes:[['#c99a4a','#7a5420','#f3dba0'],['#b8512a','#6d2a12','#f0b08a'],['#8c9a3a','#4a5416','#dfe8a0'],['#d9822b','#7d4210','#ffd7a0'],['#a3472f','#5e2314','#f0b9a8']],
    lad:{rail:'#6e4318',hi:'#c99a5a',rung:'#5b3410',rungHi:'#b8884a'},fx:null},
  snow:{name:'الثلج',ic:'❄️',ink:'#12335c',panel:'#1e3a5f',panel2:'#2a4f7d',muted:'#b9d6f2',
    a:'#f7fcff',b:'#cfe6f6',end:'#ffe08a',frame:'#8cc0e6',num:'#29506f',grid:'rgba(40,90,130,.4)',
    bg:'radial-gradient(800px 420px at 50% -5%,#5aa0d8 0%,transparent 70%),linear-gradient(180deg,#0f2a4d,#1d4e80)',
    snakes:[['#9bd1f5','#3a7fb0','#ffffff'],['#6fb7e8','#2d6a9c','#e4f3ff'],['#b7a6f2','#5846a8','#efeaff'],['#7fe0d4','#2a8a80','#e0fffb'],['#e8f2fb','#7a98b5','#ffffff']],
    lad:{rail:'#7c8fa3',hi:'#e8f2fb',rung:'#5f7388',rungHi:'#dbe9f5'},fx:{type:'fall',chars:['❄️','❅','❆']}},
  spring:{name:'الربيع',ic:'🌸',ink:'#1f5a34',panel:'#2e6b3a',panel2:'#3d8a4a',muted:'#cfeccd',
    a:'#e6f7c9',b:'#ffd9e8',end:'#ffe27a',frame:'#6cc36a',num:'#3d5a2c',grid:'rgba(60,110,50,.4)',
    bg:'radial-gradient(800px 420px at 50% -5%,#8be08a 0%,transparent 70%),linear-gradient(180deg,#1f5a34,#2f7d46)',
    snakes:[['#ff8fb8','#b8325f','#ffe1ee'],['#7ed957','#3b8a22','#e3ffc8'],['#ffd24d','#a87a00','#fff3c2'],['#ff7a6b','#a8362a','#ffd5cf'],['#5fc7a8','#1f7a62','#d4fff2']],
    lad:{rail:'#5b8a3a',hi:'#a8d97a',rung:'#4a7430',rungHi:'#94c968'},fx:{type:'fall',chars:['🌸','🌼','🍃']}},

    a:'#2e2a78',b:'#3b3590',end:'#ffcf4a',frame:'#7c5cff',num:'#d9d4ff',grid:'rgba(160,150,255,.35)',
    bg:'radial-gradient(800px 420px at 50% -5%,#5b2fd0 0%,transparent 70%),linear-gradient(180deg,#0b0624,#1a0f4a)',
    snakes:[['#ff4fd8','#8a1a78','#ffc3f4'],['#2ee6d6','#0a7f76','#c4fffa'],['#8c6bff','#3a22a8','#d8ccff'],['#ffb02e','#a35f00','#ffe2a8'],['#4fa3ff','#1a4f9e','#c8e4ff']],

};
let themeKey=localStorage.getItem('sl_theme');
if(!THEMES[themeKey])themeKey='classic';
function buildFx(T){
  const fx=$('fx');fx.innerHTML='';fx.className=T.fx?T.fx.type:'';
  if(!T.fx)return;
  for(let i=0;i<16;i++){
    const sp=document.createElement('span');
    sp.textContent=T.fx.chars[Math.floor(Math.random()*T.fx.chars.length)];
    sp.style.left=(Math.random()*100)+'%';
    sp.style.fontSize=(10+Math.random()*14)+'px';
    if(T.fx.type==='twinkle'){sp.style.top=(Math.random()*100)+'%';sp.style.animationDuration=(2+Math.random()*3)+'s';sp.style.color='#fff'}
    else sp.style.animationDuration=(9+Math.random()*9)+'s';
    sp.style.animationDelay=(-Math.random()*12)+'s';
    fx.appendChild(sp);
  }
}
function applyTheme(key){
  if(!THEMES[key])key='classic';
  themeKey=key;localStorage.setItem('sl_theme',key);
  const T=THEMES[key],r=document.documentElement.style;
  r.setProperty('--ink',T.ink);r.setProperty('--panel',T.panel);r.setProperty('--panel2',T.panel2);r.setProperty('--muted',T.muted);
  r.setProperty('--ca',T.a);r.setProperty('--cb',T.b);r.setProperty('--cend',T.end);r.setProperty('--frame',T.frame);
  r.setProperty('--num',T.num);r.setProperty('--grid',T.grid);
  document.body.style.background=T.bg;
  drawArt();buildFx(T);
}
function renderThemes(){
  const box=$('themeList');box.innerHTML='';
  Object.keys(THEMES).forEach(k=>{
    const T=THEMES[k],b=document.createElement('button');b.className='tcard'+(k===themeKey?' on':'');
    const ic=document.createElement('span');ic.className='ic';ic.textContent=T.ic;
    const sw=document.createElement('div');sw.className='sw';sw.style.setProperty('--frm',T.frame);
    [T.a,T.b,T.a,T.b].forEach(c=>{const d=document.createElement('div');d.style.background=c;sw.appendChild(d)});
    const nm=document.createElement('span');nm.textContent=T.name;
    b.append(ic,sw,nm);
    b.onclick=()=>{applyTheme(k);$('themep').classList.remove('on')};
    box.appendChild(b);
  });
}
document.querySelectorAll('[data-themes]').forEach(b=>b.onclick=()=>{renderThemes();$('themep').classList.add('on')});
applyTheme(themeKey);
</script>
